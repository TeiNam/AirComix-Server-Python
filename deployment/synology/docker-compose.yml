# AirComix Server - Synology Container Manager 용 Compose
#
# 사용법 (DSM 7.2 이상)
#   1. 이 파일과 .env 를 NAS 의 한 폴더에 올린다 (예: /volume1/docker/aircomix)
#   2. Container Manager > 프로젝트 > 생성 > 기존 docker-compose.yml 업로드
#
# 구버전(aircomix-server-py.json)에서 넘어올 때 반드시 바뀌는 것은 README.md 참고.

services:
  aircomix-server:
    # latest 는 main 에 머지될 때마다 preview 빌드로 덮인다. 버전을 고정한다.
    image: teinam/aircomix-server:1.0.2
    container_name: aircomix-server
    restart: unless-stopped

    ports:
      - "31257:31257"

    volumes:
      # 만화 컬렉션. 읽기 전용으로 마운트한다.
      - "${MANGA_DIRECTORY}:/comix:ro"
      # 썸네일 캐시. manga 가 읽기 전용이라 별도 볼륨이 필요하다.
      - "aircomix-cache:/app/cache"

    environment:
      COMIX_MANGA_DIRECTORY: /comix
      COMIX_SERVER_HOST: 0.0.0.0
      COMIX_SERVER_PORT: 31257
      COMIX_THUMBNAIL_CACHE_DIRECTORY: /app/cache

      # 인증. 설정 키는 COMIX_ 접두어가 붙어야 읽힌다.
      COMIX_ENABLE_AUTH: "${COMIX_ENABLE_AUTH:-false}"
      COMIX_AUTH_PASSWORD: "${COMIX_AUTH_PASSWORD:-}"

      COMIX_LOG_LEVEL: "${COMIX_LOG_LEVEL:-INFO}"
      COMIX_DEBUG_MODE: "false"

    # 목록형 설정은 JSON 배열 형식이어야 한다. 콤마 구분 문자열은 파싱 오류로 기동에 실패한다.
    #  COMIX_IMAGE_EXTENSIONS: '["jpg", "jpeg", "png", "gif", "bmp", "webp"]'
    #  COMIX_ARCHIVE_EXTENSIONS: '["zip", "rar", "cbz", "cbr"]'

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:31257/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

    # NAS 사양에 맞게 조정한다. 0 이면 제한 없음.
    mem_limit: "${MEMORY_LIMIT:-1g}"

volumes:
  aircomix-cache:
    driver: local
