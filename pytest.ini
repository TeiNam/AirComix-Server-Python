[pytest]
minversion = 7.0
addopts = -ra -q --strict-markers --strict-config
testpaths = tests
asyncio_mode = auto
# php_origins 는 PHP 원본 포팅 시점의 참고용 트리다.
# tests/conftest.py 와 모듈 경로가 충돌해 수집 단계에서 실패하므로 제외한다.
norecursedirs = php_origins .git .venv venv build dist *.egg-info
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (실행 중인 서버 필요)
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
