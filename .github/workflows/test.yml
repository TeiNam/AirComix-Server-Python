name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  # 다른 워크플로(도커 빌드/릴리스)에서 게이트로 재사용한다
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # 설정 검증이 실제 디렉토리를 요구하므로 워크스페이스 안에 만든다
      COMIX_MANGA_DIRECTORY: ${{ github.workspace }}/.test-manga

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -r requirements-dev.txt

      - name: Prepare manga directory
        run: mkdir -p "${COMIX_MANGA_DIRECTORY}"

      - name: Run tests
        run: uv run pytest -q

      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest --cov=app --cov-report=term-missing -q
